<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Opt – Family Finance</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <h1>Open Opt</h1>
      <p class="tagline">Wealthsimple-style family finance</p>
      <div id="auth-actions"></div>
    </header>

    <div id="login-section" class="panel">
      <h2>Sign in</h2>
      <form id="login-form">
        <label>Email <input type="email" id="login-email" required placeholder="mock_smith_family_0@example.com" /></label>
        <label>Password <input type="password" id="login-password" required placeholder="mock123" /></label>
        <button type="submit">Sign in</button>
      </form>
      <p id="login-error" class="error"></p>
    </div>

    <div id="dashboard-section" class="hidden">
      <section class="panel">
        <h2>Households</h2>
        <ul id="household-list"></ul>
      </section>
      <section class="panel">
        <h2>Accounts</h2>
        <ul id="account-list"></ul>
      </section>
      <section class="panel">
        <h2>Goals</h2>
        <ul id="goal-list"></ul>
      </section>

      <section class="panel recommendations-panel">
        <h2>Ask for recommendations</h2>
        <p class="hint">e.g. &ldquo;Best way to save for the kids&rsquo; education and our retirement&rdquo;</p>
        <form id="recommendation-form">
          <textarea id="recommendation-question" rows="2" placeholder="Your question..."></textarea>
          <button type="submit">Get recommendations</button>
        </form>
        <div id="recommendation-loading" class="hidden">Loading…</div>
        <div id="recommendation-result" class="hidden">
          <div id="recommendation-narrative" class="narrative"></div>
          <div id="recommendation-chart-container" class="chart-container hidden">
            <canvas id="recommendation-chart"></canvas>
          </div>
        </div>
      </section>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
